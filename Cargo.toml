[workspace]
members = [
    "compiler/crates/lucid-syntax",
    "compiler/crates/lucid-abi",
    "compiler/crates/lucid-db",
    "compiler/crates/lucid-cir",
    "compiler/crates/lucid-config",
    "compiler/crates/lucid-checker",
    "compiler/crates/lucid-codegen",
    "compiler/crates/lucid-runtime",
    "compiler/crates/lucid-cli",
]
resolver = "2"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
