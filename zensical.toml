[project]
site_url = "https://neilgirdhar.github.io/lucid/"
site_name = "Lucid"
site_description = "A Python-like language sketch with cleaner type, dispatch, object, and compatibility rules."
repo_url = "https://github.com/NeilGirdhar/lucid"
repo_name = "NeilGirdhar/lucid"
edit_uri = "edit/main/docs/"
docs_dir = "docs"

nav = [
  { "Home" = "index.md" },
  { "Main ideas" = "principles.md" },
  { "Names" = [
    { "Binding" = "names.md" },
    { "Destructuring with let" = "destructuring.md" },
    { "Scope" = "scope.md" },
  ] },
  { "Types" = [
    { "Type vocabulary" = "types.md" },
    { "Operations" = "type-operations.md" },
    { "Match types" = "match-types.md" },
    { "Casting" = "casting.md" },
    { "Mutability" = "mutability.md" },
    { "Generics" = "generics.md" },
    { "Numeric types" = "numeric-types.md" },
  ] },
  { "Operators" = [
    { "Identity and instance checks" = "identity-checks.md" },
    { "The ? operator" = "question-mark-operator.md" },
  ] },
  { "Statements" = [
    { "If" = "if.md" },
    { "For and While" = "for-and-while.md" },
    { "Match" = "match.md" },
    { "Exceptions" = "exceptions.md" },
    { "With" = "with.md" },
    { "Import" = "import.md" },
  ] },
  { "Functions" = [
    { "Multiple dispatch" = "dispatch.md" },
    { "Call-site captured values" = "call-site-captured-values.md" },
    { "Context managers" = "context-managers.md" },
    { "Results" = "results.md" },
  ] },
  { "Containers" = [
    { "Collections" = "collections.md" },
    { "Indexing" = "indexing.md" },
    { "Strings" = "strings.md" },
  ] },
  { "Traits and classes" = [
    { "Overview" = "type-specification.md" },
    { "Traits" = "traits.md" },
    { "Classes" = "classes.md" },
    { "Anonymous class" = "anonymous-class.md" },
    { "Class members" = "class-members.md" },
    { "Class inheritance" = "class-inheritance.md" },
    { "Construction" = "construction.md" },
  ] },
  { "Calls" = "calls.md" },
  { "Parameters and decorators" = [
    { "Arguments" = "arguments.md" },
    { "Parameters" = "parameters.md" },
    { "Gather" = "gather.md" },
    { "Spread" = "spread.md" },
    { "Decorators" = "decorators.md" },
  ] },
  { "Projects" = [
    { "Project configuration" = "project-configuration.md" },
    { "project.yaml" = "project-yaml.md" },
    { "development.yaml" = "development-yaml.md" },
    { "lucid.lock" = "lucid-lock.md" },
    { "Module-private names" = "modules.md" },
  ] },
  { "Keyword reference" = "keywords.md" },
  { "Rejected features" = "rejected-features.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.select",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
pymdownx.superfences = {}
